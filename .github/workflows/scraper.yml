name: CV Finanzas - Scraper MONEX

on:
  schedule:
    - cron: '05 19 * * *'  # 13:05 Costa Rica (UTC-6) - todos los días
    - cron: '00 23 * * *'  # 17:00 Costa Rica (UTC-6) - todos los días
  workflow_dispatch:          # permite correrlo manualmente cuando quieras

concurrency:
  group: cv-finanzas-scraper-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scraper:
    runs-on: ubuntu-latest
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      BCCR_API_BEARER_TOKEN: ${{ secrets.BCCR_API_BEARER_TOKEN }}
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests pytz

      - name: Correr scraper
        run: python automatizadores/scraper_bccr.py

      - name: Publicar datos.json
        run: |
          git config user.name "CV Finanzas Bot"
          git config user.email "bot@cvfinanzas.com"
          git add datos-json/datos.json || echo "datos.json no encontrado, saltando"

          if git diff --staged --quiet; then
            echo "Sin cambios"
            exit 0
          fi

          git commit -m "datos: actualizar tipo de cambio $(date +'%Y-%m-%d %H:%M')"

          for intento in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push rechazado (intento $intento). Sincronizando con origin/main..."
            git fetch origin main
            git rebase -X theirs origin/main
          done

          echo "No se pudo publicar datos.json después de 3 intentos."
          exit 1
